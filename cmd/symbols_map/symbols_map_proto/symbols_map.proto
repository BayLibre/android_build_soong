syntax = "proto2";

package symbols_map;
option go_package = "android/soong/cmd/symbols_map/symbols_map_proto";

message Mapping {
  optional string identifier = 1;
  optional string location = 2;
  optional string type = 3;
}

message Mappings {
  repeated Mapping mappings = 4;
}